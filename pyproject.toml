[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pscdl-2026"
version = "1.0.0"
description = "Persistent Scene Change Detection for PSCDL 2026"
readme = "README.md"
authors = [
    {name = "Jiyaro Joseph", email = "jiyarojoseph27.mec@gmail.com"},
    {name = "Joseph S. Mathew", email = "josephsmathew.mec@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
]

[project.scripts]
pscdl = "src.generate_mask:main"